name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub Release
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package versions
        run: |
          for p in packages/*/package.json; do
            v=$(node -p "require('./$p').version")
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::$p is $v, tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # npm, not pnpm, does the OIDC exchange. The tarballs from `pnpm build`
      # already have workspace: ranges and publishConfig applied.
      - run: for t in packages/*/.pack/*.tgz; do npm publish "$t"; done
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
