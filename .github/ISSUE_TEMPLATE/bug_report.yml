name: Bug report
description: Something in the SDK doesn't work as documented
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@hootask/js"
        - "@hootask/react"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.0.1
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal code or a link to a repository.
      render: tsx
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime and version (browser, Node, Bun…), framework and version.
